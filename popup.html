<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAW Research Search</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div id="hdr">
  <span id="hdr-logo">&#9878;</span>
  <span id="hdr-title">GAW Research Search</span>
  <span id="hdr-sub">Firehose Archive</span>
  <button id="hdr-add-btn" title="Can't find a post? Paste its link and we'll add it to the search.">&#8853; Add a Post</button>
  <button id="hdr-saved-btn" aria-expanded="false" aria-controls="saved-panel">&#9776; My Searches</button>
</div>

<div id="add-panel" aria-hidden="true">
  <div id="add-panel-hint">Add a missing post &mdash; paste a full post link (greatawakening.win/p/&hellip;) to index it right now.</div>
  <div id="add-row">
    <input id="add-url" type="text" placeholder="https://greatawakening.win/p/..." autocomplete="off" aria-label="greatawakening.win post link to add" maxlength="2048">
    <button id="btn-add-submit">Add</button>
  </div>
  <div id="add-status" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<div id="search-wrap">
  <div id="search-row" role="search">
    <input id="q" type="text" placeholder="Search 90,000+ GAW posts and comments..." autocomplete="off" autofocus aria-label="Search GAW posts and comments" maxlength="256">
    <button id="btn-save" title="Save this search" aria-label="Save this search" aria-pressed="false">&#9733;</button>
    <button id="btn-search">Search</button>
  </div>
</div>

<button id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">
  <span id="filter-arrow">&#9658;</span>
  <span id="filter-toggle-txt">Filters</span>
</button>

<div id="filters">
  <div class="f-row">
    <span class="f-label">Date</span>
    <input type="date" id="f-date-from" title="From">
    <span class="f-date-sep">to</span>
    <input type="date" id="f-date-to" title="To">
  </div>
  <div class="f-row">
    <span class="f-label">Author</span>
    <input type="text" id="f-author" placeholder="Username" aria-label="Filter by author username" maxlength="64">
    <span class="f-label" style="text-align:right;width:40px">Score</span>
    <div class="f-score-wrap">
      <select id="f-score-op" aria-label="Score comparison">
        <option value="">Any</option>
        <option value=">=">At least</option>
        <option value=">">More than</option>
      </select>
      <input type="number" id="f-score-val" placeholder="e.g. 50" min="0" aria-label="Score value">
    </div>
  </div>
  <div class="f-row">
    <span class="f-label">Flair</span>
    <input type="text" id="f-flair" placeholder="e.g. News, Memes..." aria-label="Filter by flair" maxlength="80">
    <span class="f-label" style="text-align:right;width:66px">Min &#128172;</span>
    <input type="number" id="f-min-comments" placeholder="0" min="0" style="flex:0 0 70px" aria-label="Minimum comment count">
  </div>
  <div class="f-row">
    <span class="f-label">Scope</span>
    <select id="f-scope">
      <option value="both">Posts &amp; Comments</option>
      <option value="posts">Posts only</option>
      <option value="comments">Comments only</option>
    </select>
    <span class="f-label" style="text-align:right;width:40px">Sort</span>
    <select id="f-sort">
      <option value="relevance">Relevance</option>
      <option value="date">Newest first</option>
      <option value="score">Top scored</option>
    </select>
  </div>
</div>

<div id="status-bar" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="recent"></div>

<div id="main-content" style="display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0">
  <div id="results"></div>
  <div id="empty">
    <span class="empty-icon">&#128269;</span>
    <span class="empty-txt">Dig the Firehose archive</span>
    <span class="empty-hint">90,000+ posts &amp; comments &bull; deleted ones too &bull; no login, no tracking</span>
  </div>
  <button id="load-more">Dig deeper</button>
</div>

<div id="saved-panel">
  <div id="saved-hdr">
    <h2>Saved Searches</h2>
    <button id="btn-saved-close" aria-label="Close saved searches">&times;</button>
  </div>
  <div id="saved-list"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
